name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ["8.1", "8.2", "8.3"]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f Dockerfile.test --build-arg PHP=${{ matrix.php }} -t codeskop-php-test .
      - run: docker run --rm codeskop-php-test
